name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not covered by any cargo command: a tests/e2e/*.rs with no `mod` line in
      # main.rs compiles fine and simply never runs. CI also never builds the
      # e2e binary (bare `cargo test`, no --features e2e), so this is the only
      # place the omission can be caught here.
      - run: scripts/check_test_modules.sh
      - run: cargo check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rust-analyzer
      - run: make deps/tree-sitter
      - run: cargo test
      - run: cargo test --features e2e --test e2e e2e_type_hierarchy::
      - run: cargo test --features e2e --test e2e e2e_host_bridge::e2e_document_color
      - run: cargo test --features e2e --test e2e e2e_host_bridge::e2e_color_presentation
      - run: cargo test --features e2e --test e2e e2e_host_bridge::e2e_inline_value
      - run: cargo test --features e2e --test e2e e2e_host_bridge::e2e_semantic_tokens_range
      - run: cargo test --features e2e --test e2e e2e_host_bridge::e2e_semantic_tokens_full

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy -- -D warnings

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      - run: cargo audit
