name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-output:
    name: CLI output (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare fs-verity fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fsverity
          mkdir -p "$RUNNER_TEMP/kakehashi-verity"
          truncate -s 64M "$RUNNER_TEMP/kakehashi-verity.img"
          mkfs.ext4 -q -O verity "$RUNNER_TEMP/kakehashi-verity.img"
          sudo mount -o loop "$RUNNER_TEMP/kakehashi-verity.img" "$RUNNER_TEMP/kakehashi-verity"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/kakehashi-verity"
          echo "KAKEHASHI_TEST_VERITY_ROOT=$RUNNER_TEMP/kakehashi-verity" >> "$GITHUB_ENV"
      - run: cargo test --bin kakehashi
      - name: Unmount fs-verity fixture
        if: always() && runner.os == 'Linux'
        run: |
          if mountpoint -q "$RUNNER_TEMP/kakehashi-verity"; then
            sudo umount "$RUNNER_TEMP/kakehashi-verity"
          fi

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not covered by any cargo command: a tests/e2e/*.rs with no `mod` line in
      # main.rs compiles fine and simply never runs, even in the E2E job.
      - run: scripts/check_test_modules.sh
      - run: cargo check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS/Windows are slow, so they gate pushes to main, not PRs.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # A hung test otherwise holds the runner for the 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rust-analyzer
      - run: make deps/tree-sitter
      - run: cargo test
      - run: "cargo test --features e2e --test e2e e2e_type_hierarchy::"
      - run: "cargo test --features e2e --test e2e e2e_bridge_peer::"

  resolve-e2e:
    name: Resolve E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # These suites exercise lazy resolve with real bridge subprocesses,
      # including edits/reopens while replies are parked by the mock server.
      - run: >-
          cargo test --features e2e --test e2e --
          e2e_completion_envelope:: e2e_host_bridge:: e2e_code_action::
          e2e_code_lens_resolve:: e2e_lsp_lua_document_link:: --test-threads=2

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    # cfg(windows)/cfg(unix) branches only type-check on their own OS.
    strategy:
      fail-fast: false
      matrix:
        # macOS/Windows are slow, so they gate pushes to main, not PRs.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy -- -D warnings

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      - run: cargo audit
