name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not covered by any cargo command: a tests/e2e/*.rs with no `mod` line in
      # main.rs compiles fine and simply never runs, even in the E2E job.
      - run: scripts/check_test_modules.sh
      - run: cargo check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rust-analyzer
      - run: make deps/tree-sitter
      - run: cargo test
      - run: cargo test --features e2e --test e2e e2e_type_hierarchy::
      - run: cargo test --features e2e --test e2e e2e_selection_range::
      - run: cargo test --features e2e --test e2e e2e_workspace_symbol::
      - run: cargo test --features e2e --test e2e e2e_workspace_diagnostic::
      - run: cargo test --features e2e --test e2e e2e_host_bridge::e2e_inline_value
      - run: cargo test --features e2e --test e2e e2e_host_bridge::e2e_semantic_tokens_range
      - run: cargo test --features e2e --test e2e e2e_host_bridge::e2e_semantic_tokens_full

  resolve-e2e:
    name: Resolve E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # These suites exercise lazy resolve with real bridge subprocesses,
      # including edits/reopens while replies are parked by the mock server.
      - run: >-
          cargo test --features e2e --test e2e --
          e2e_completion_envelope:: e2e_host_bridge:: e2e_code_action::
          e2e_code_lens_resolve:: e2e_lsp_lua_document_link:: --test-threads=2

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy -- -D warnings

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      - run: cargo audit
